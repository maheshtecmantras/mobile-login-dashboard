<main class="login-shell"><section class="login-intro"><div class="brand-mark">L</div><p class="eyebrow">WELCOME BACK</p><h1>Sign in to your account</h1><p class="subtitle">Manage your day with a clear view of everything that matters.</p></section><form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate><label for="email">Email address</label><input id="email" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email"><small class="error" *ngIf="submitted && form.controls.email.errors">Enter a valid email address.</small><label for="password">Password</label><div class="password-wrap"><input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter your password" autocomplete="current-password"><button type="button" class="show-button" (click)="showPassword = !showPassword">{{ showPassword ? 'Hide' : 'Show' }}</button></div><small class="error" *ngIf="submitted && form.controls.password.errors">Password must be at least 6 characters.</small><button class="primary-button" type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign in' }}</button><p class="demo-hint">Demo mode · any valid email and 6+ character password</p></form></main>
